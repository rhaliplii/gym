<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rostislav Training Log</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a one-handed phone logbook. Accordion of exercises, rest timer and tabs pinned to the thumb zone, barbell loads up as exercises finish. */
:root{
  --bg:#e6ebf0; --surface:#f5f7f9; --sunk:#d8e0e8; --ink:#1b222a; --ink2:#4f5c69; --line:#c3ced8;
  --steel:#2b343e; --on-steel:#f1f4f7; --accent:#d9400f; --accent-ink:#b5330a; --on-accent:#fff; --good:#1f7a55; --plate:#c3ced8;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171c; --surface:#1c232a; --sunk:#262f38; --ink:#eef2f5; --ink2:#a0adb9; --line:#35404b;
  --steel:#2e3944; --on-steel:#f1f4f7; --accent:#f0602a; --accent-ink:#ff8a5c; --on-accent:#14100e; --good:#4cc493; --plate:#3b4753; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --surface:#1c232a; --sunk:#262f38; --ink:#eef2f5; --ink2:#a0adb9; --line:#35404b;
  --steel:#2e3944; --on-steel:#f1f4f7; --accent:#f0602a; --accent-ink:#ff8a5c; --on-accent:#14100e; --good:#4cc493; --plate:#3b4753; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:600px;margin:0 auto;padding-block:16px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h1,h2,.disp{font-family:var(--display);font-weight:800;line-height:1;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
h1{font-size:44px}h2{font-size:27px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.sub{color:var(--ink2);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:6px;font-weight:600;background:var(--sunk);text-align:center}
.btn.go{background:var(--accent);color:var(--on-accent)}
.btn.line{background:none;border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.danger{color:var(--accent-ink);border:1px solid var(--accent-ink);background:none}
header.top{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}

/* Program: plate-stamped day cards */
.day{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:14px;background:var(--surface);border-radius:8px}
.stamp{width:62px;height:62px;border-radius:50%;background:var(--steel);color:var(--on-steel);display:grid;place-items:center;font:800 27px/1 var(--display);box-shadow:inset 0 0 0 5px var(--steel),inset 0 0 0 6px color-mix(in srgb,var(--on-steel) 35%,transparent)}
.day.next{box-shadow:0 0 0 2px var(--accent)}
.day.next .stamp{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 0 0 5px var(--accent),inset 0 0 0 6px color-mix(in srgb,var(--on-accent) 45%,transparent)}
.day h2{font-size:25px}
.day .meta{font-size:13px;color:var(--ink2);margin-top:3px}
.chev{color:var(--ink2);font-size:20px}
.rest{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;align-items:center;padding:4px 14px;color:var(--ink2)}
.rest .stamp{background:none;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);height:38px;width:38px;font-size:18px;justify-self:center}
.notice{padding:10px 12px;border-radius:6px;background:var(--sunk);font-size:13.5px}

/* Session */
.shead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 0 10px;padding:12px 0 8px}
.bar{width:100%;height:40px;display:block}
.ex{background:var(--surface);border-radius:8px;overflow:hidden}
.ex-h{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:8px 12px 8px 8px}
.ex-h img{width:72px;height:48px;object-fit:cover;border-radius:4px;background:var(--sunk);display:block}
.ex-n{font:800 21px/1.05 var(--display);text-transform:uppercase}
.ex-m{font-size:13px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.tick{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex.done .tick{background:var(--good);color:var(--surface)}
.ex.done .ex-h img{opacity:.6}
.plate{display:block;width:100%;aspect-ratio:1024/688;max-width:100%;object-fit:cover;background:var(--sunk);height:auto}
.ex-b{padding:12px;display:flex;flex-direction:column;gap:12px}
.hint{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.use{min-height:36px;padding:0 12px;border-radius:18px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13.5px}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:26px minmax(0,1fr) 14px minmax(0,1fr) 52px;gap:8px;align-items:center}
.set .n{font:800 20px/1 var(--display);color:var(--ink2);text-align:center}
.head{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:center;margin-bottom:-2px}
.set input{width:100%;height:50px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:center;font:800 25px/1 var(--display);font-variant-numeric:tabular-nums;min-width:0;padding:0}
.set input::placeholder{color:var(--ink2);font-size:18px;font-weight:600}
.x{text-align:center;color:var(--ink2)}
.chk{width:52px;height:50px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:21px;color:var(--ink2)}
.set.on .chk{background:var(--good);border-color:var(--good);color:var(--surface)}
.set.on input{border-color:transparent;background:var(--sunk)}
.cues{margin:0;padding-left:18px;font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:3px}
details summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink2);padding:4px 0}
details .cues{margin-top:6px}
textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:9px 10px;font-size:14px;resize:vertical}
.tgt{font-size:12.5px;color:var(--ink2);text-align:center;font-variant-numeric:tabular-nums}

/* Dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{height:54px;text-align:center;font-weight:600;font-size:14px;color:var(--ink2)}
.tabs button[aria-current="page"]{color:var(--accent-ink);box-shadow:inset 0 2px 0 var(--accent)}
#timer{background:var(--steel);color:var(--on-steel);position:relative;overflow:hidden}
#timer .fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 55%,var(--steel))}
#timer .in{position:relative;max-width:600px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:6px;align-items:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
#timer .t{font:800 36px/1 var(--display);font-variant-numeric:tabular-nums}
#timer .t small{display:block;font:500 12px/1.2 var(--body);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer button{min-width:44px;height:44px;border-radius:6px;text-align:center;font-weight:600;font-size:14px;padding:0 6px;background:color-mix(in srgb,var(--on-steel) 16%,transparent)}

/* Progress */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border-radius:8px;padding:12px}
.tile b{display:block;font:800 32px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--ink2)}
.panel{background:var(--surface);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.weeks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.wk{display:grid;grid-template-rows:repeat(4,10px);gap:2px}
.wk i{background:var(--sunk);border-radius:2px}.wk i.on{background:var(--accent)}
.wk+.x{display:none}
.wkl{font-size:11px;color:var(--ink2);text-align:center;margin-top:4px;font-variant-numeric:tabular-nums}
select{width:100%;height:46px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 10px}
svg text{fill:var(--ink2);font:500 11px var(--body);font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column}
.hist>button,.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;font-variant-numeric:tabular-nums}
.hist>button:first-child,.hrow:first-child{border-top:0}

/* Library */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.card .nm{padding:8px 10px 10px;font:800 18px/1.05 var(--display);text-transform:uppercase}
.card .nm small{display:block;margin-top:3px;font:400 12.5px/1.25 var(--body);text-transform:none;color:var(--ink2)}
.daytabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:16px}
.daytabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;padding:8px 2px;border-radius:6px;background:var(--surface);text-align:center}
.daytabs b{font:800 22px/1 var(--display)}
.daytabs span{font-size:11px;line-height:1.15;color:var(--ink2)}
.daytabs button[aria-pressed="true"]{background:var(--steel);color:var(--on-steel)}
.daytabs button[aria-pressed="true"] span{color:var(--on-steel)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:3px;vertical-align:middle}
.filter{display:flex;gap:6px;overflow-x:auto;margin:0 -2px;padding:2px}
.filter button{flex:none;min-height:38px;padding:0 13px;border-radius:19px;background:var(--sunk);font-size:13.5px;font-weight:500}
.filter button[aria-pressed="true"]{background:var(--steel);color:var(--on-steel)}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 50%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:600px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.close{position:sticky;top:0;float:right;margin:8px 8px -52px 0;width:44px;height:44px;border-radius:50%;background:var(--steel);color:var(--on-steel);text-align:center;font-size:18px;z-index:1}
.assume{font-size:13.5px;padding:9px 11px;background:var(--sunk);border-radius:6px}
.fine{font-size:12.5px;color:var(--ink2)}
.pr{color:var(--accent-ink);font-weight:600}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.bar rect.new{animation:load .35s ease-out}@keyframes load{from{transform:translateY(-6px);opacity:0}}}
</style>
</head>
<body>

<div id="app"></div>
<div id="dock"><div id="timer" hidden></div><nav class="tabs" id="tabs" aria-label="Sections"></nav></div>
<div id="sheet" hidden></div>

<script>
// ---------- Program (sets, reps and rest copied from the coach's PDF) ----------
const X = (name,img,muscles,type,cues,assume)=>({name,img,muscles,type,cues,assume});
const EX = {
 pullups:X("Pull-ups","pull-ups","Lats, upper back, biceps","bw",["Start from a full hang, shoulders set down.","Pull elbows toward your ribs until the chin clears the bar.","Lower under control. No swinging."]),
 bss:X("Bulgarian split squats","bulgarian-split-squat","Quads, glutes","db",["Rear laces on the bench, front foot far enough forward that the heel stays down.","Drop straight down until the front thigh is about parallel.","Drive through the front heel."]),
 dbrow:X("Dumbbell rows","dumbbell-rows","Lats, mid back","db",["Flat back, one knee and hand on the bench.","Pull the dumbbell to your hip, not your chest.","Pause at the top. Don't twist open."]),
 hip:X("Hip thrust","hip-thrust","Glutes","bar",["Bench under the shoulder blades, shins vertical at the top.","Chin tucked, ribs down.","Squeeze the glutes for a beat. Don't arch the lower back."],"Drawn with a barbell."),
 rdl:X("Romanian deadlift","romanian-deadlift","Hamstrings, glutes","bar",["Soft knees, push the hips straight back.","Bar stays close to the legs, back stays flat.","Stop when the hamstrings stop lengthening, then drive the hips forward."],"Drawn with a barbell."),
 pullover:X("Pullover","pullover","Lats, lower chest","db",["Keep a slight, fixed bend in the elbows.","Lower in an arc until you feel the stretch under the arms.","Pull back over the chest using the lats. Keep the ribs down."],"Drawn as a dumbbell pullover. Your coach may mean the cable version."),
 shrug:X("Cable shrugs","cable-shrugs","Upper traps","mach",["Arms stay straight.","Lift the shoulders straight up to the ears.","Hold one second. Don't roll the shoulders."]),
 pallof:X("Pallof press","pallof-press","Obliques, abs","mach",["Stand side-on to the cable with the handle at mid-chest.","Press straight out and hold for a beat.","Don't let the cable turn your torso."]),
 smith:X("Incline Smith chest press","incline-smith-press","Upper chest, front delts, triceps","mach",["Bench at about 30 degrees, bar path over the upper chest.","Shoulder blades pinned back and down.","Lower with control, press without bouncing."]),
 fly:X("Cable flys","cable-flys","Chest","mach",["Fixed soft bend in the elbows.","Open until you feel a chest stretch, not a shoulder pinch.","Bring the hands together and squeeze."]),
 dips:X("Dips","dips","Lower chest, triceps","bw",["Slight forward lean, shoulders away from the ears.","Lower until the elbows reach about 90 degrees.","Press to straight arms without shrugging."]),
 cgb:X("Close-grip bench press","close-grip-bench","Triceps, inner chest","bar",["Hands about shoulder width, not touching.","Keep the elbows close to the ribs.","Touch the lower chest, press to lockout."]),
 scurl:X("Seated biceps curl","seated-biceps-curl","Biceps","db",["Back on the pad, elbows pinned at your sides.","Curl without the shoulders rolling forward.","Lower slowly all the way."],"Drawn with dumbbells."),
 chammer:X("Cable hammer curl","cable-hammer-curl","Brachialis, forearms, biceps","mach",["Rope in a neutral grip, thumbs up.","Elbows stay fixed.","Lower until the arms are fully straight."]),
 peck:X("Rear-delt pec deck","rear-delt-pec-deck","Rear delts, upper back","mach",["Chest on the pad, handles at shoulder height.","Sweep the arms wide, leading with the elbows.","Pause, then return slowly."]),
 deadbug:X("Dead bugs","dead-bugs","Deep abs","bw",["Press the lower back into the mat and keep it there.","Reach one arm and the opposite leg away, slowly.","Exhale on the reach, then switch."],"I log 30 as total reps across both sides. Check this with your coach."),
 oblique:X("Oblique crunch","oblique-crunch","Obliques","bw",["Lie on your side with the knees stacked.","Lift the top shoulder toward the hip.","Don't pull on the neck."],"Drawn as a floor side crunch. Your coach may mean a cable or bench version."),
 legext:X("Leg extensions","leg-extensions","Quads","mach",["Knee joint lined up with the machine's pivot.","Extend fully and hold for a beat.","Lower with control. Don't let the stack touch."]),
 legcurl:X("Leg curl","leg-curl","Hamstrings","mach",["Pad just above the heels, hips pressed down.","Curl the heels toward the glutes.","Control the way back."],"Drawn as the lying machine. Your gym may have a seated one."),
 calf:X("Seated calf raises","seated-calf-raises","Calves","mach",["Balls of the feet on the platform.","Pause in the deep stretch at the bottom.","Rise as high as you can and hold."]),
 pulldown:X("Lat pulldown","lat-pulldown","Lats","mach",["Thighs locked under the pad, chest up.","Pull the bar to the upper chest with the elbows.","Let the arms straighten at the top."]),
 hrow:X("Hammer rows","hammer-rows","Mid back, lats","mach",["Chest on the pad.","Drive the elbows behind your body.","Squeeze the shoulder blades, then reach forward fully."],"Drawn as a plate-loaded Hammer Strength style machine row. Check this with your coach."),
 taps:X("Plank shoulder taps","plank-shoulder-taps","Abs, obliques","bw",["Feet wider than the hips, straight line from head to heel.","Tap the opposite shoulder without shifting the hips.","Move slowly."],"I log 20 as total taps. Check this with your coach."),
 kbpull:X("KB plank pull-through (16 kg)","kb-pull-through","Abs, obliques","fixed",["High plank with the kettlebell beside you.","Reach under with the opposite hand and drag it across.","Keep the hips level throughout."],"I log 20 as total pulls. Check this with your coach."),
 clat:X("Cable lateral raises","cable-lateral-raises","Side delts","mach",["Low pulley, cable across the front of the body.","Raise to shoulder height, leading with the elbow.","Lower slowly."],"Drawn as single-arm. Log the weight used per arm."),
 spress:X("Shoulder press","shoulder-press","Front and side delts, triceps","db",["Ribs down, back against the pad.","Press up and slightly in.","Lower to about ear height."],"Drawn as a seated dumbbell press. Your coach may mean a machine or barbell."),
 sraise:X("Seated dumbbell raises","seated-dumbbell-raises","Side delts","db",["Sit tall with no swinging.","Raise out to shoulder height, elbows soft.","Lower slowly."],"Drawn as lateral raises, as it follows the shoulder press. Your coach may mean front raises."),
 rfly:X("Single-arm rear-delt cable fly","rear-delt-cable-fly","Rear delts","mach",["Pulley at shoulder height.","Sweep the arm back in a wide arc without turning the torso.","Pause, then return with control."]),
 ccurl:X("Cable biceps curl","cable-biceps-curl","Biceps","mach",["Elbows pinned at your sides.","Curl to shoulder height without leaning back.","Fully straighten at the bottom."],"Drawn with a straight bar."),
 shammer:X("Seated hammer curl","seated-hammer-curl","Brachialis, forearms","db",["Palms face each other through the whole rep.","Elbows stay fixed.","Lower slowly."]),
 tri:X("Triceps extension","triceps-extension","Triceps","mach",["Upper arms fixed at your sides.","Straighten fully and spread the rope at the bottom.","Return to about 90 degrees."],"Drawn as a rope pushdown. Your coach may mean an overhead extension."),
 skull:X("Standing skullcrushers","standing-skullcrushers","Triceps","mach",["Lean forward in a staggered stance.","Upper arms stay still beside the ears.","Bend at the elbows only, then extend fully."],"Drawn with a high cable behind you. This is my best reading of the name, so check it with your coach."),
 sstri:X("Single-arm triceps ext.","single-arm-triceps","Triceps","mach",["Upper arm fixed at your side.","Straighten fully.","Control the way back."],"Drawn as a single-arm cable pushdown. Your coach may mean overhead."),
 kbworld:X("KB around the world (16 kg)","kb-around-the-world","Abs, obliques, forearms","fixed",["Stand tall with the hips and ribs still.","Pass the kettlebell hand to hand around the waist.","Change direction for the other side."]),
 renegade:X("Renegade rows (10 kg)","renegade-rows","Lats, mid back, abs","fixed",["Wide feet, high plank on the dumbbells.","Row to the ribs without rotating the hips.","Set it down softly, then switch."]),
 climbers:X("Mountain climbers","mountain-climbers","Abs, hip flexors","bw",["Hands under the shoulders, hips low.","Drive the knees toward the chest.","Keep a steady pace."],"I log 30 as total knee drives. Check this with your coach."),
};
const FIXED={kbpull:16,kbworld:16,renegade:10};
const INC={db:2,bar:2.5,mach:2.5};
const rep=(n,r)=>Array(n).fill(r);
const P=(id,reps,rest,per)=>({id,reps,rest,per});
const DAYS={
 1:{title:"Back + Legs",blurb:"Pulling strength, posterior chain and core stability",list:[P("pullups",rep(4,6),120),P("bss",rep(3,10),120,"leg"),P("dbrow",[10,8,8],90),P("hip",[12,10,10],90),P("rdl",rep(3,12),90),P("pullover",rep(3,12),60),P("shrug",rep(3,15),60),P("pallof",rep(3,15),30,"side")]},

 4:{title:"Legs + Back",blurb:"Lower-body volume, back thickness and anti-rotation core",list:[P("bss",rep(3,10),120,"leg"),P("hip",rep(3,12),90),P("legext",rep(3,12),90),P("legcurl",rep(3,12),90),P("calf",rep(3,15),60),P("pulldown",[12,10,6],120),P("hrow",rep(3,12),120),P("taps",rep(3,20),30),P("kbpull",rep(3,20),30)]},

async function flush(){

    const data=id==="active"?{active:S.active,updatedAt:S.activeAt}:S.sessions[id];
    if(!data){delete S.dirty[id];continue}
    await col.doc(id).set(JSON.parse(JSON.stringify(data)));
    const cur=id==="active"?{active:S.active,updatedAt:S.activeAt}:S.sessions[id];
    if(cur&&cur.updatedAt===data.updatedAt)delete S.dirty[id];
  }saveLocal();syncState="synced"}

}

async function connect(){
  if(!window.claude?.use)return;
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  const uid=user&&await user.id();
  if(!db||!uid)return;
  col=db.collection("data/users/"+uid);
  col.onSnapshot(snap=>{
    let changed=false;
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;
      if(d.id==="active"){if((v.updatedAt||0)>S.activeAt){S.active=v.active||null;S.activeAt=v.updatedAt;changed=true}}

    });
    const have=new Set(snap.docs.map(d=>d.id));
    Object.keys(S.sessions).forEach(id=>{if(!have.has(id))S.dirty[id]=1});
    if(S.activeAt&&!have.has("active"))S.dirty.active=1;

}

const finished=()=>Object.values(S.sessions).filter(s=>!s.deleted&&s.finishedAt&&Object.values(s.ex||{}).some(e=>e.sets.some(x=>x.done))).sort((a,b)=>b.finishedAt-a.finishedAt);
function lastFor(id,before=Infinity){
  for(const s of finished()){if(s.finishedAt>=before)continue;const e=s.ex?.[id];if(e&&e.sets.some(x=>x.done))return {s,e}}
  return null;
}
const doneSets=e=>e.sets.filter(x=>x.done);
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const topKg=e=>Math.max(0,...doneSets(e).map(x=>num(x.kg)));
const topReps=e=>Math.max(0,...doneSets(e).map(x=>num(x.reps)));
const volume=s=>Object.values(s.ex||{}).reduce((a,e)=>a+doneSets(e).reduce((b,x)=>b+num(x.kg)*num(x.reps),0),0);
function suggest(p){
  const t=EX[p.id].type;if(t==="bw"||t==="fixed")return null;
  const l=lastFor(p.id);if(!l)return null;
  const ds=l.e.sets;
  const kg=topKg(l.e);if(!kg)return null;
  const hit=p.reps.every((r,i)=>ds[i]&&ds[i].done&&num(ds[i].reps)>=r&&num(ds[i].kg)>=kg);
  return hit?kg+INC[t]:null;
}

function finishSession(){
  const a=S.active;const s={id:a.id,day:a.day,startedAt:a.startedAt,finishedAt:Date.now(),updatedAt:Date.now(),ex:{}};

function chart(id){
  const pts=finished().slice().reverse().map(s=>({s,e:s.ex?.[id]})).filter(o=>o.e&&o.e.sets.some(x=>x.done)).slice(-16);
  const useKg=pts.some(o=>topKg(o.e)>0);
  const val=o=>useKg?topKg(o.e):topReps(o.e), unit=useKg?"kg":"reps";
  const title=`<p class="sub">${useKg?"Heaviest set":"Most reps in a set"} per session, ${unit}</p>`;
  const W=340,H=170,L=34,R=14,T=12,B=24;
  const vs=pts.map(val);let lo=Math.min(...vs),hi=Math.max(...vs);

  const step0=(hi-lo)/3,mag=10**Math.floor(Math.log10(step0)),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0);

  const line=pts.map((o,i)=>sx(i)+","+sy(val(o))).join(" ");
  const area=pts.length>1?`<polygon points="${sx(0)},${H-B} ${line} ${sx(pts.length-1)},${H-B}" fill="var(--accent)" opacity=".12"/>`:"";
  const dots=pts.map((o,i)=>`<g><title>${dstr(o.s.finishedAt)}: ${val(o)} ${unit}</title><circle cx="${sx(i)}" cy="${sy(val(o))}" r="${i===pts.length-1?5:4}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><circle cx="${sx(i)}" cy="${sy(val(o))}" r="14" fill="transparent" data-a="pt" data-t="${dstr(o.s.finishedAt)}: ${val(o)} ${unit}"/></g>`).join("");
  const xl=`<text x="${sx(0)}" y="${H-6}" text-anchor="${pts.length<2?"middle":"start"}">${dstr(pts[0].s.finishedAt)}</text>`+(pts.length>1?`<text x="${sx(pts.length-1)}" y="${H-6}" text-anchor="end">${dstr(pts[pts.length-1].s.finishedAt)}</text>`:"");
  return title+`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block" role="img" aria-label="${esc(EX[id].name)} progress">${g}${area}<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${dots}${xl}</svg>
  <p class="fine" id="ptinfo">${pts.length<2?"One session logged. The trend starts with the next one.":"Latest: "+val(pts[pts.length-1])+" "+unit+". Tap a point for its value."}</p>
  <button class="btn line" data-a="sheet" data-id="${id}">Sets from every session</button>`;
}
function vLibrary(){
  const ids=libFilter?DAYS[libFilter].list.map(p=>p.id):Object.keys(EX);
  return `<header class="top"><span class="lbl">${Object.keys(EX).length} exercises</span><h1>Exercises</h1></header>
  <div class="stack"><div class="filter">${[[0,"All"],[1,"Day 01"],[2,"Day 02"],[4,"Day 04"],[5,"Day 05"]].map(([d,l])=>`<button data-a="lib" data-d="${d}" aria-pressed="${libFilter===d}">${l}</button>`).join("")}</div>
  <div class="grid">${ids.map(id=>`<button class="card" data-a="sheet" data-id="${id}"><img class="plate" src="${img(id)}" alt="${esc(EX[id].name)}" loading="lazy"><span class="nm">${esc(EX[id].name)}<small>${libFilter?fmtPlan(DAYS[libFilter].list.find(p=>p.id===id))+" · ":""}${esc(EX[id].muscles)}</small></span></button>`).join("")}</div>
  <p class="fine">Sets, reps and rest come from your coach's program. The pictures and technique cues were added for this app, so check them with your coach.</p></div>`;
}
const sheetEl=document.getElementById("sheet");
function openSheet(html){sheetEl.innerHTML=`<div class="sheet-in" role="dialog" aria-modal="true"><button class="close" data-a="close" aria-label="Close">×</button>${html}</div>`;sheetEl.hidden=false;sheetEl.querySelector(".close").focus({preventScroll:true})}
function closeSheet(){sheetEl.hidden=true;sheetEl.innerHTML=""}
function exSheet(id){
  const x=EX[id];const where=ORDER.flatMap(d=>DAYS[d].list.filter(p=>p.id===id).map(p=>`<div class="hrow"><span>Day ${pad(d)} · ${DAYS[d].title}</span><span class="sub">${fmtPlan(p)} · ${fmtRest(p.rest)}</span></div>`)).join("");
  const hist=finished().map(s=>({s,e:s.ex?.[id]})).filter(o=>o.e&&o.e.sets.some(v=>v.done)).slice(0,12);
  openSheet(`<img class="plate" src="${img(id)}" alt="${esc(x.name)}: start and end position, ${esc(x.muscles)} highlighted"><div class="sheet-b"><h2>${esc(x.name)}</h2><p class="sub">${esc(x.muscles)}</p>
  <ul class="cues">${x.cues.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>${x.assume?`<p class="assume">${esc(x.assume)}</p>`:""}
  <div><span class="lbl">In your program</span><div class="hist">${where}</div></div>
  ${hist.length?`<div><span class="lbl">Your sets</span><div class="hist">${hist.map(o=>`<div class="hrow"><span>${dstr(o.s.finishedAt)}</span><span class="sub">${doneSets(o.e).map(v=>(num(v.kg)?num(v.kg)+" × ":"")+num(v.reps)).join(", ")}</span></div>`).join("")}</div></div>`:""}</div>`);
}
function summary(s,prs){
  const sets=Object.values(s.ex).reduce((a,e)=>a+doneSets(e).length,0);
  openSheet(`<div class="sheet-b" style="padding-top:20px"><span class="lbl">Workout saved</span><h2 style="padding-right:44px">Day ${pad(s.day)} · ${DAYS[s.day].title}</h2>
  <div class="tiles"><div class="tile" style="background:var(--bg)"><b>${Math.round((s.finishedAt-s.startedAt)/60000)}</b><span>minutes</span></div><div class="tile" style="background:var(--bg)"><b>${sets}</b><span>sets</span></div><div class="tile" style="background:var(--bg)"><b>${Math.round(volume(s)).toLocaleString()}</b><span>kg lifted</span></div></div>
  ${prs.length?`<div><span class="lbl">New records</span>${prs.map(p=>`<p class="pr">${esc(p)}</p>`).join("")}</div>`:""}
  <p class="sub">Next: ${s.day===2?"Day 03 rest, then ":""}Day ${pad(ORDER[(ORDER.indexOf(s.day)+1)%4])} · ${DAYS[ORDER[(ORDER.indexOf(s.day)+1)%4]].title}</p>
  <button class="btn go wide" data-a="close">Done</button></div>`);
}
function histSheet(id,confirm){
  const s=S.sessions[id];
  openSheet(`<div class="sheet-b" style="padding-top:20px"><span class="lbl">${dstr(s.finishedAt,{weekday:"long",day:"numeric",month:"long"})}</span><h2 style="padding-right:44px">Day ${pad(s.day)} · ${DAYS[s.day].title}</h2>
  <div class="hist">${Object.entries(s.ex).map(([k,e])=>`<div class="hrow"><span>${esc(EX[k].name)}${e.note?`<br><span class="fine">${esc(e.note)}</span>`:""}</span><span class="sub" style="text-align:right">${doneSets(e).map(v=>(num(v.kg)?num(v.kg)+" × ":"")+num(v.reps)).join(", ")||"–"}</span></div>`).join("")}</div>
  ${confirm?`<button class="btn danger wide" data-a="delhist2" data-id="${id}">Yes, delete this workout</button>`:`<button class="btn line wide" data-a="delhist" data-id="${id}">Delete workout</button>`}</div>`);
}
async function exportCsv(){
  const rows=[["date","day","exercise","set","kg","reps"]];
  finished().slice().reverse().forEach(s=>Object.entries(s.ex).forEach(([k,e])=>e.sets.forEach((x,i)=>{if(x.done)rows.push([new Date(s.finishedAt).toISOString().slice(0,10),s.day,'"'+EX[k].name+'"',i+1,num(x.kg),num(x.reps)])})));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));a.download="rostislav-training-log.csv";a.click();URL.revokeObjectURL(a.href);
}

// ---------- Events ----------
function onAct(t){
  const a=t.dataset.a;
  if(!actx&&(window.AudioContext||window.webkitAudioContext))try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(actx?.state==="suspended")actx.resume();
  if(a==="tab"){view=t.dataset.v;render();scrollTo(0,0)}
  else if(a==="start"){overview=false;dayTab=+t.dataset.d;startSession(dayTab)}
  else if(a==="dayview"){dayTab=+t.dataset.d;overview=false;render();scrollTo(0,0)}
  else if(a==="overview"){overview=true;render();scrollTo(0,0)}
  else if(a==="jump"){S.active.open=+t.dataset.i;overview=false;commit();render();scrollToOpen()}
  else if(a==="open"){const i=+t.dataset.i;S.active.open=S.active.open===i?-1:i;commit();render();scrollToOpen()}
  else if(a==="check"){
    const e=S.active.ex[t.dataset.id],k=+t.dataset.k,s=e.sets[k];s.done=!s.done;
    if(s.done){const list=DAYS[S.active.day].list,p=list[+t.dataset.i];
      if(k+1<e.sets.length&&e.sets[k+1].kg===""&&s.kg!=="")e.sets[k+1].kg=s.kg;
      const allDone=e.sets.every(x=>x.done);let label=EX[p.id].name;
      if(allDone){const n=firstOpen();label=n>=0?EX[list[n].id].name:"finish up";S.active.open=n>=0?n:-1}
      else label="set "+(e.sets.findIndex(x=>!x.done)+1);
      startTimer(p.rest,label);commit();render();if(allDone)scrollToOpen();
    }else{commit();render()}
  }
  else if(a==="use"){const e=S.active.ex[t.dataset.id];e.sets.forEach(x=>{if(!x.done)x.kg=t.dataset.kg});commit();render()}
  else if(a==="finish"){if(Object.values(S.active.ex).some(e=>e.sets.some(x=>x.done)))finishSession();else{confirmDrop=true;render()}}
  else if(a==="drop"){confirmDrop=true;render()}
  else if(a==="drop0"){confirmDrop=false;render()}
  else if(a==="drop2"){confirmDrop=false;S.active=null;stopTimer();commit();releaseWake();render();scrollTo(0,0)}
  else if(a==="t+15"){T.end+=15000;T.total+=15;drawTimer()}
  else if(a==="t-15"){T.end-=15000;drawTimer()}
  else if(a==="tskip"){stopTimer()}
  else if(a==="snd"){S.sound=!S.sound;saveLocal();drawTimer()}
  else if(a==="sheet"){exSheet(t.dataset.id)}
  else if(a==="close"){closeSheet()}
  else if(a==="lib"){libFilter=+t.dataset.d;render()}
  else if(a==="hist"){histSheet(t.dataset.id)}
  else if(a==="delhist"){histSheet(t.dataset.id,true)}
  else if(a==="delhist2"){const s=S.sessions[t.dataset.id];s.deleted=true;s.updatedAt=Date.now();touch(s.id);closeSheet();render()}
  else if(a==="csv"){exportCsv()}
  else if(a==="pt"){const i=document.getElementById("ptinfo");if(i)i.textContent=t.dataset.t}
}
function scrollToOpen(){const el=document.querySelector('.ex-h[aria-expanded="true"]');if(!el)return;const y=el.getBoundingClientRect().top+scrollY-92;scrollTo({top:y})}
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-a]");if(ev.target===sheetEl){closeSheet();return}if(t&&t.tagName!=="SELECT")onAct(t)});
document.addEventListener("input",ev=>{const t=ev.target;
  if(t.dataset.f&&S.active){const e=S.active.ex[t.dataset.id];
    if(t.dataset.f==="note")e.note=t.value;else e.sets[+t.dataset.k][t.dataset.f]=t.value;commit()}
});
document.addEventListener("change",ev=>{if(ev.target.id==="progsel"){progEx=ev.target.value;render()}});
document.addEventListener("focusin",ev=>{if(ev.target.matches?.(".set input"))ev.target.select?.()});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!sheetEl.hidden)closeSheet()});
setInterval(()=>{if(view==="train"&&S.active&&!document.activeElement?.matches("input,textarea")){const el=document.querySelector(".shead .sub");if(el)el.textContent=Math.round((Date.now()-S.active.startedAt)/60000)+" min"}},30000);
render();if(S.active)wake();connect();
</script>
